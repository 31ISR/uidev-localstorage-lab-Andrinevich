<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Мои задачи</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="app">
            <h1 class="app__title">Мои задачи</h1>

            <form class="app__form" id="todo-form">
                <input
                    type="text"
                    class="app__input"
                    id="todo-input"
                    placeholder="Что нужно сделать?"
                    autocomplete="off"
                    required />
                <button type="submit" class="app__add-btn">Добавить</button>
            </form>

            <ul class="app__list" id="todo-list"></ul>

            <p class="app__empty" id="empty-state" hidden>
                Список пуст. Добавьте первую задачу
            </p>

            <footer class="app__footer">
                <span id="counter"></span>
                <button id="clear-btn" type="button">
                    Очистить всё
                </button>
            </footer>
        </main>

        <script src="script.js"></script>
    </body>
</html>
